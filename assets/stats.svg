<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="3 security tools, 34 detection checks, 13 MITRE ATT&amp;CK techniques, 34 unit tests, all in CI">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <style>
      .n { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; font-size: 46px; font-weight: 700; fill: url(#a); }
      .t { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; font-size: 16px; fill: #cbd5e1; }
      .s { font-family: 'JetBrains Mono', Consolas, Menlo, monospace; font-size: 12px; fill: #64748b; }
    </style>
  </defs>
  <!-- Numbers come from the three security repos; update them when a project is added. -->
  <g>
    <rect x="0" y="0" width="285" height="150" rx="14" fill="#0b1220" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="142" y="68" text-anchor="middle" class="n">3</text>
    <text x="142" y="98" text-anchor="middle" class="t">security tools shipped</text>
    <text x="142" y="122" text-anchor="middle" class="s">logs · recon · phishing</text>
  </g>
  <g transform="translate(305 0)">
    <rect width="285" height="150" rx="14" fill="#0b1220" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="142" y="68" text-anchor="middle" class="n">34</text>
    <text x="142" y="98" text-anchor="middle" class="t">detection checks written</text>
    <text x="142" y="122" text-anchor="middle" class="s">8 + 14 + 12</text>
  </g>
  <g transform="translate(610 0)">
    <rect width="285" height="150" rx="14" fill="#0b1220" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="142" y="68" text-anchor="middle" class="n">13</text>
    <text x="142" y="98" text-anchor="middle" class="t">MITRE ATT&amp;CK techniques</text>
    <text x="142" y="122" text-anchor="middle" class="s">mapped across findings</text>
  </g>
  <g transform="translate(915 0)">
    <rect width="285" height="150" rx="14" fill="#0b1220" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="142" y="68" text-anchor="middle" class="n">34</text>
    <text x="142" y="98" text-anchor="middle" class="t">unit tests, all in CI</text>
    <text x="142" y="122" text-anchor="middle" class="s">GitHub Actions on every push</text>
  </g>
</svg>
