<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Boda Chaitanya Sai. I learned to break in. Now I build what catches it. 4 security tools, 52 security checks, 13 ATT&amp;CK techniques, 47 tests in CI"><defs>
