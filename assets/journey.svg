<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 205" width="1200" height="205" role="img" aria-label="Journey: 2023: Started B.Tech (CSE (Cyber Security), SRMIST); May – Aug 2026: VAPT Intern (Dhara Global Solutions); Nov 2026: Shipped 3 detection tools (tested, in CI, mapped to ATT&amp;CK); May 2027: Graduating (open to security roles)"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#0f1f3d"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient>
