<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 216" width="1200" height="216" role="img" aria-label="Toolbox. I test with: Nmap, Nessus, Burp Suite, Metasploit, Wireshark, OWASP Top 10. I detect with: Python, C, MITRE ATT&amp;CK, Log analysis, Phishing triage, IOC extraction. I deploy with: Linux, AWS, Docker, Kubernetes, Terraform, Ansible, Jenkins, GitHub Actions"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#0f1f3d"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.3"/></pattern>
<style>
.cursor { animation: blink 1.1s steps(1) infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; }
.row { animation: show 10s steps(1) infinite backwards; }  /* visible by default if animation is off */
.scan { animation: sweep 7s linear infinite; }
@keyframes blink { 50% { opacity: 0; } }
@keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
@keyframes show { 0% { opacity: 0; } 3% { opacity: 1; } 97% { opacity: 1; } 100% { opacity: 0; } }
@keyframes sweep { from { transform: translateX(-200px); } to { transform: translateX(1400px); } }
@media (prefers-reduced-motion: reduce) { .cursor, .pulse, .row, .scan { animation: none; opacity: 1; } }
