<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 360" width="590" height="360" role="img" aria-label="Phishing Email Analyzer: Triage a reported email in one command. Sample output: Verdict: LIKELY PHISHING (score 25); T1566      SPF fail, DMARC fail; T1656      claims 'paypal', sent by paypa1; T1566.002  link text ≠ destination; T1036.007  invoice.pdf.exe; hxxp://203[.]0[.]113[.]9/login"><defs>
