<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 100" width="1200" height="100" role="img" aria-label="Decorative animated waves"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#e3efff"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563eb"/><stop offset="0.5" stop-color="#f59e0b"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c5d9f2" stroke-width="1" opacity="0.45"/></pattern>
<style>
.cursor { animation: blink 1.1s steps(1) infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; }
.row { animation: show 10s steps(1) infinite backwards; }  /* visible by default if animation is off */
.scan { animation: sweep 7s linear infinite; }
.spark { animation: rise 6s ease-in infinite backwards; }
.bob { animation: bob 3.2s ease-in-out infinite; }
.pop { animation: pop 0.7s ease-out backwards; }
.lit { animation: lit 6s linear infinite; }
@keyframes blink { 50% { opacity: 0; } }
@keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
@keyframes show { 0% { opacity: 0; } 3% { opacity: 1; } 97% { opacity: 1; } 100% { opacity: 0; } }
@keyframes sweep { from { transform: translateX(-220px); } to { transform: translateX(1400px); } }
@keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 0.9; } 100% { transform: translateY(-150px); opacity: 0; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes pop { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lit { 0%, 14% { fill: #dbeafe; } 22%, 100% { fill: #ffffff; } }
@media (prefers-reduced-motion: reduce) { .cursor, .pulse, .row, .scan, .spark, .bob, .pop, .lit { animation: none; opacity: 1; } }
</style></defs><clipPath id="clip"><rect width="1200" height="100" rx="18"/></clipPath><g clip-path="url(#clip)"><path d="M0 52 q150 -44 300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 V100 H0 Z" fill="#0ea5e9" opacity="0.35"><animateTransform attributeName="transform" type="translate" values="-1200 0;0 0" dur="9s" repeatCount="indefinite"/></path><path d="M0 64 q150 -44 300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 V100 H0 Z" fill="#2563eb" opacity="0.55"><animateTransform attributeName="transform" type="translate" values="0 0;-1200 0" dur="6s" repeatCount="indefinite"/></path><circle class="spark" style="animation-delay:0s" cx="200" cy="60" r="4" fill="#f59e0b"/><circle class="spark" style="animation-delay:1.5s" cx="520" cy="70" r="3" fill="#f59e0b"/><circle class="spark" style="animation-delay:3s" cx="840" cy="62" r="4" fill="#f59e0b"/><circle class="spark" style="animation-delay:4.2s" cx="1060" cy="72" r="3" fill="#f59e0b"/></g></svg>