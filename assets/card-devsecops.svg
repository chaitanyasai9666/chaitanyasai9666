<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 360" width="590" height="360" role="img" aria-label="Secure DevSecOps pipeline: Commit (git push) then SonarQube (SAST) then Trivy (image scan) then OWASP ZAP (DAST) then Kubernetes (deploy) then Prometheus (monitor + alert)"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#0f1f3d"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.3"/></pattern>
<style>
.cursor { animation: blink 1.1s steps(1) infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; }
.row { animation: show 10s steps(1) infinite backwards; }  /* visible by default if animation is off */
.scan { animation: sweep 7s linear infinite; }
@keyframes blink { 50% { opacity: 0; } }
@keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
@keyframes show { 0% { opacity: 0; } 3% { opacity: 1; } 97% { opacity: 1; } 100% { opacity: 0; } }
@keyframes sweep { from { transform: translateX(-200px); } to { transform: translateX(1400px); } }
@media (prefers-reduced-motion: reduce) { .cursor, .pulse, .row, .scan { animation: none; opacity: 1; } }
</style></defs><clipPath id="clip"><rect width="590" height="360" rx="18"/></clipPath><g clip-path="url(#clip)"><rect width="590" height="360" fill="url(#bg)"/><rect width="590" height="360" fill="url(#grid)"/><text x="30" y="50" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#f1f5f9" text-anchor="start" xml:space="preserve" >Secure DevSecOps Pipeline</text><text x="30" y="78" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#cbd5e1" text-anchor="start" xml:space="preserve" >A healthcare API with a security gate at every stage</text><rect x="30" y="92" width="60" height="3" rx="1.5" fill="url(#accent)"/><g class="pulse" style="animation-delay:0.0s"><rect x="30" y="128" width="160" height="70" rx="10" fill="#0a0f1c" stroke="#22d3ee" stroke-width="1.5"/></g><text x="110" y="159" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#f1f5f9" text-anchor="middle" xml:space="preserve" >Commit</text><text x="110" y="181" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#cbd5e1" text-anchor="middle" xml:space="preserve" >git push</text><g class="pulse" style="animation-delay:0.4s"><rect x="215" y="128" width="160" height="70" rx="10" fill="#0a0f1c" stroke="#fb923c" stroke-width="1.5"/></g><text x="295" y="159" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#f1f5f9" text-anchor="middle" xml:space="preserve" >SonarQube</text><text x="295" y="181" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#fb923c" text-anchor="middle" xml:space="preserve" >SAST</text><g class="pulse" style="animation-delay:0.8s"><rect x="400" y="128" width="160" height="70" rx="10" fill="#0a0f1c" stroke="#fb923c" stroke-width="1.5"/></g><text x="480" y="159" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#f1f5f9" text-anchor="middle" xml:space="preserve" >Trivy</text><text x="480" y="181" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#fb923c" text-anchor="middle" xml:space="preserve" >image scan</text><g class="pulse" style="animation-delay:1.2s"><rect x="400" y="236" width="160" height="70" rx="10" fill="#0a0f1c" stroke="#fb923c" stroke-width="1.5"/></g><text x="480" y="267" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#f1f5f9" text-anchor="middle" xml:space="preserve" >OWASP ZAP</text><text x="480" y="289" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#fb923c" text-anchor="middle" xml:space="preserve" >DAST</text><g class="pulse" style="animation-delay:1.6s"><rect x="215" y="236" width="160" height="70" rx="10" fill="#0a0f1c" stroke="#22d3ee" stroke-width="1.5"/></g><text x="295" y="267" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#f1f5f9" text-anchor="middle" xml:space="preserve" >Kubernetes</text><text x="295" y="289" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#cbd5e1" text-anchor="middle" xml:space="preserve" >deploy</text><g class="pulse" style="animation-delay:2.0s"><rect x="30" y="236" width="160" height="70" rx="10" fill="#0a0f1c" stroke="#22d3ee" stroke-width="1.5"/></g><text x="110" y="267" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#f1f5f9" text-anchor="middle" xml:space="preserve" >Prometheus</text><text x="110" y="289" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#cbd5e1" text-anchor="middle" xml:space="preserve" >monitor + alert</text><text x="202.5" y="170" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1" text-anchor="middle" xml:space="preserve" >→</text><text x="387.5" y="170" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1" text-anchor="middle" xml:space="preserve" >→</text><text x="480" y="224" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1" text-anchor="middle" xml:space="preserve" >↓</text><text x="387.5" y="278" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1" text-anchor="middle" xml:space="preserve" >←</text><text x="202.5" y="278" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1" text-anchor="middle" xml:space="preserve" >←</text><circle cx="36" cy="334" r="5" fill="#fb923c"/><text x="50" y="339" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#cbd5e1" text-anchor="start" xml:space="preserve" >security gate</text><text x="560" y="339" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#64748b" text-anchor="end" xml:space="preserve" >Jenkins · Docker · AWS EC2</text></g><rect x="0.75" y="0.75" width="588.5" height="358.5" rx="18" fill="none" stroke="#1e3a5f" stroke-width="1.5"/></svg>