<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 360" width="590" height="360" role="img" aria-label="Secure DevSecOps pipeline: Commit (git push) then SonarQube (SAST) then Trivy (image scan) then OWASP ZAP (DAST) then Kubernetes (deploy) then Prometheus (monitor + alert)"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#e3efff"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563eb"/><stop offset="0.5" stop-color="#f59e0b"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c5d9f2" stroke-width="1" opacity="0.45"/></pattern>
<style>
.cursor { animation: blink 1.1s steps(1) infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; }
.row { animation: show 10s steps(1) infinite backwards; }  /* visible by default if animation is off */
.scan { animation: sweep 7s linear infinite; }
.spark { animation: rise 6s ease-in infinite backwards; }
.bob { animation: bob 3.2s ease-in-out infinite; }
.pop { animation: pop 0.7s ease-out backwards; }
.lit { animation: lit 6s linear infinite; }
@keyframes blink { 50% { opacity: 0; } }
@keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
@keyframes show { 0% { opacity: 0; } 3% { opacity: 1; } 97% { opacity: 1; } 100% { opacity: 0; } }
@keyframes sweep { from { transform: translateX(-220px); } to { transform: translateX(1400px); } }
@keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 0.9; } 100% { transform: translateY(-150px); opacity: 0; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes pop { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lit { 0%, 14% { fill: #dbeafe; } 22%, 100% { fill: #ffffff; } }
@media (prefers-reduced-motion: reduce) { .cursor, .pulse, .row, .scan, .spark, .bob, .pop, .lit { animation: none; opacity: 1; } }
</style></defs><clipPath id="clip"><rect width="590" height="360" rx="18"/></clipPath><g clip-path="url(#clip)"><rect width="590" height="360" fill="url(#bg)"/><rect width="590" height="360" fill="url(#grid)"/><circle class="spark" style="animation-delay:0.5s" cx="520" cy="90" r="3" fill="#f59e0b"/><circle class="spark" style="animation-delay:2.5s" cx="470" cy="70" r="4" fill="#f59e0b"/><circle class="spark" style="animation-delay:4s" cx="550" cy="60" r="3" fill="#f59e0b"/><text x="30" y="50" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#0f2747" text-anchor="start" xml:space="preserve" >Secure DevSecOps Pipeline</text><text x="30" y="78" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#47627f" text-anchor="start" xml:space="preserve" >A healthcare API with a security gate at every stage</text><rect x="30" y="92" width="60" height="4" rx="2" fill="url(#accent)"><animate attributeName="width" values="30;120;30" dur="5s" repeatCount="indefinite"/></rect><circle r="6" fill="#f59e0b"><animateMotion dur="6s" repeatCount="indefinite" path="M110 163 L480 163 L480 271 L110 271"/></circle><rect class="lit" style="animation-delay:-0.4s" x="30" y="128" width="160" height="70" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="110" y="159" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#0f2747" text-anchor="middle" xml:space="preserve" >Commit</text><text x="110" y="181" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#47627f" text-anchor="middle" xml:space="preserve" >git push</text><rect class="lit" style="animation-delay:0.9s" x="215" y="128" width="160" height="70" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/><text x="295" y="159" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#0f2747" text-anchor="middle" xml:space="preserve" >SonarQube</text><text x="295" y="181" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#ea580c" text-anchor="middle" xml:space="preserve" >SAST</text><rect class="lit" style="animation-delay:2.2s" x="400" y="128" width="160" height="70" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/><text x="480" y="159" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#0f2747" text-anchor="middle" xml:space="preserve" >Trivy</text><text x="480" y="181" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#ea580c" text-anchor="middle" xml:space="preserve" >image scan</text><rect class="lit" style="animation-delay:3.0s" x="400" y="236" width="160" height="70" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/><text x="480" y="267" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#0f2747" text-anchor="middle" xml:space="preserve" >OWASP ZAP</text><text x="480" y="289" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#ea580c" text-anchor="middle" xml:space="preserve" >DAST</text><rect class="lit" style="animation-delay:4.3s" x="215" y="236" width="160" height="70" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="295" y="267" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#0f2747" text-anchor="middle" xml:space="preserve" >Kubernetes</text><text x="295" y="289" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#47627f" text-anchor="middle" xml:space="preserve" >deploy</text><rect class="lit" style="animation-delay:5.5s" x="30" y="236" width="160" height="70" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="110" y="267" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#0f2747" text-anchor="middle" xml:space="preserve" >Prometheus</text><text x="110" y="289" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#47627f" text-anchor="middle" xml:space="preserve" >monitor + alert</text><text x="202.5" y="150" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#8aa0b8" text-anchor="middle" xml:space="preserve" >→</text><text x="387.5" y="150" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#8aa0b8" text-anchor="middle" xml:space="preserve" >→</text><text x="500" y="224" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#8aa0b8" text-anchor="middle" xml:space="preserve" >↓</text><text x="387.5" y="296" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#8aa0b8" text-anchor="middle" xml:space="preserve" >←</text><text x="202.5" y="296" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#8aa0b8" text-anchor="middle" xml:space="preserve" >←</text><circle class="pulse" cx="36" cy="334" r="5" fill="#ea580c"/><text x="50" y="339" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#47627f" text-anchor="start" xml:space="preserve" >security gate</text><text x="560" y="339" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#8aa0b8" text-anchor="end" xml:space="preserve" >Jenkins · Docker · AWS EC2</text></g><rect x="0.75" y="0.75" width="588.5" height="358.5" rx="18" fill="none" stroke="#c5d9f2" stroke-width="1.5"/></svg>