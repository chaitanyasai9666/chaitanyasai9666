<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Boda Chaitanya Sai - Cyber Security, VAPT, Detection Tooling">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f1f3d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.35"/>
    </pattern>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace; }
      .sans { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .scan { animation: sweep 6s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .l1 { animation: show 9s steps(1) infinite; }
      .l2 { animation: show 9s steps(1) infinite; animation-delay: 1s; opacity: 0; }
      .l3 { animation: show 9s steps(1) infinite; animation-delay: 2s; opacity: 0; }
      .l4 { animation: show 9s steps(1) infinite; animation-delay: 3s; opacity: 0; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes sweep { from { transform: translateX(-200px); } to { transform: translateX(1400px); } }
      @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
      @keyframes show { 0% { opacity: 0; } 4% { opacity: 1; } 96% { opacity: 1; } 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cursor, .scan, .pulse, .l1, .l2, .l3, .l4 { animation: none; opacity: 1; } }
    </style>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect class="scan" x="0" y="0" width="160" height="320" fill="#22d3ee" opacity="0.05"/>
    <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

    <!-- left: identity -->
    <text x="60" y="92" class="mono" font-size="17" fill="#34d399">$ whoami</text>
    <text x="60" y="150" class="sans" font-size="54" font-weight="700" fill="#f1f5f9" letter-spacing="1">Boda Chaitanya Sai</text>
    <rect x="60" y="170" width="250" height="4" rx="2" fill="url(#accent)"/>
    <text x="60" y="212" class="sans" font-size="23" fill="#cbd5e1">Cyber Security  ·  VAPT  ·  Detection Tooling in Python</text>
    <text x="60" y="262" class="mono" font-size="16" fill="#94a3b8">B.Tech CSE (Cyber Security), SRMIST  |  VAPT Intern 2026<tspan class="cursor" fill="#22d3ee"> ▍</tspan></text>

    <!-- right: terminal card -->
    <g transform="translate(770 56)">
      <rect width="380" height="216" rx="12" fill="#0a0f1c" stroke="#1e3a5f" stroke-width="1.5"/>
      <circle cx="22" cy="20" r="5.5" fill="#f87171"/>
      <circle cx="42" cy="20" r="5.5" fill="#fbbf24"/>
      <circle cx="62" cy="20" r="5.5" fill="#34d399"/>
      <text x="190" y="25" class="mono" font-size="12" fill="#64748b" text-anchor="middle">detections.log</text>
      <line x1="0" y1="38" x2="380" y2="38" stroke="#1e3a5f"/>
      <g class="mono" font-size="14">
        <text class="l1" x="20" y="70"><tspan fill="#f87171">[CRIT]</tspan><tspan fill="#cbd5e1"> T1078  login after brute force</tspan></text>
        <text class="l2" x="20" y="100"><tspan fill="#fb923c">[HIGH]</tspan><tspan fill="#cbd5e1"> T1190  SQL injection attempt</tspan></text>
        <text class="l3" x="20" y="130"><tspan fill="#fb923c">[HIGH]</tspan><tspan fill="#cbd5e1"> T1566  link text mismatch</tspan></text>
        <text class="l4" x="20" y="160"><tspan fill="#fbbf24">[MED ]</tspan><tspan fill="#cbd5e1"> T1595  directory scan</tspan></text>
        <text x="20" y="194" fill="#34d399">$<tspan class="cursor" fill="#22d3ee"> ▍</tspan></text>
      </g>
      <circle class="pulse" cx="356" cy="20" r="4" fill="#34d399"/>
    </g>
  </g>
</svg>
