<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 360" width="590" height="360" role="img" aria-label="Log Threat Analyzer: A mini SIEM rule engine for SSH and web logs. Sample output: 57 log lines analyzed, 8 findings; T1078      login after brute force; T1110.001  SSH brute force; T1110.003  password spraying; T1190      SQL injection attempt; T1595.003  web directory scan"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#0f1f3d"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.3"/></pattern>
<style>
.cursor { animation: blink 1.1s steps(1) infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; }
.row { animation: show 10s steps(1) infinite backwards; }  /* visible by default if animation is off */
.scan { animation: sweep 7s linear infinite; }
@keyframes blink { 50% { opacity: 0; } }
@keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
@keyframes show { 0% { opacity: 0; } 3% { opacity: 1; } 97% { opacity: 1; } 100% { opacity: 0; } }
@keyframes sweep { from { transform: translateX(-200px); } to { transform: translateX(1400px); } }
@media (prefers-reduced-motion: reduce) { .cursor, .pulse, .row, .scan { animation: none; opacity: 1; } }
</style></defs><clipPath id="clip"><rect width="590" height="360" rx="18"/></clipPath><g clip-path="url(#clip)"><rect width="590" height="360" fill="url(#bg)"/><rect width="590" height="360" fill="url(#grid)"/><text x="30" y="50" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#f1f5f9" text-anchor="start" xml:space="preserve" >Log Threat Analyzer</text><text x="30" y="78" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#cbd5e1" text-anchor="start" xml:space="preserve" >A mini SIEM rule engine for SSH and web logs</text><rect x="30" y="92" width="60" height="3" rx="1.5" fill="url(#accent)"/><g transform="translate(30 112)"><rect width="530" height="228" rx="12" fill="#0a0f1c" stroke="#1e3a5f" stroke-width="1.5"/><circle cx="22" cy="20" r="5.5" fill="#f87171"/><circle cx="42" cy="20" r="5.5" fill="#fbbf24"/><circle cx="62" cy="20" r="5.5" fill="#34d399"/><text x="265.0" y="25" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle" xml:space="preserve" >logs.sh</text><line x1="0" y1="38" x2="530" y2="38" stroke="#1e3a5f"/><text x="20" y="66" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" xml:space="preserve"><tspan fill="#34d399">$</tspan><tspan fill="#f1f5f9"> python log_analyzer.py auth.log access.log</tspan></text><text class="row" style="animation-delay:0.6s" x="20" y="92" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" xml:space="preserve"><tspan fill="#f1f5f9" font-weight="700">57 log lines analyzed, 8 findings</tspan></text><text class="row" style="animation-delay:1.3s" x="20" y="116" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" xml:space="preserve"><tspan fill="#f87171">[CRIT]</tspan><tspan fill="#cbd5e1"> T1078      login after brute force</tspan></text><text class="row" style="animation-delay:2.0s" x="20" y="140" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" xml:space="preserve"><tspan fill="#fb923c">[HIGH]</tspan><tspan fill="#cbd5e1"> T1110.001  SSH brute force</tspan></text><text class="row" style="animation-delay:2.7s" x="20" y="164" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" xml:space="preserve"><tspan fill="#fb923c">[HIGH]</tspan><tspan fill="#cbd5e1"> T1110.003  password spraying</tspan></text><text class="row" style="animation-delay:3.4s" x="20" y="188" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" xml:space="preserve"><tspan fill="#fb923c">[HIGH]</tspan><tspan fill="#cbd5e1"> T1190      SQL injection attempt</tspan></text><text class="row" style="animation-delay:4.1s" x="20" y="212" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" xml:space="preserve"><tspan fill="#fbbf24">[MED ]</tspan><tspan fill="#cbd5e1"> T1595.003  web directory scan</tspan></text></g></g><rect x="0.75" y="0.75" width="588.5" height="358.5" rx="18" fill="none" stroke="#1e3a5f" stroke-width="1.5"/></svg>